name: check
on: [push, pull_request]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 check.py
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: for f in */*.lua; do luac5.4 -p "$f" || exit 1; done  # each one compiles
